name: Go source and vulnerability security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Verify pinned toolchain
        run: test "$(go env GOVERSION)" = "go$(cat .go-version)"
      - name: Verify module checksums
        run: go mod verify
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan reachable dependencies
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  gosec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Verify pinned toolchain
        run: test "$(go env GOVERSION)" = "go$(cat .go-version)"
      - name: Install pinned gosec v2.30.0
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
      - name: Scan Go source (all default rules)
        run: '"$(go env GOPATH)/bin/gosec" ./...'
